# Root production compose file. Sub-stacks live under compose/ and are merged via `include`.
# Requires Docker Compose v2.20+.
include:
  - compose/production/infra.production.yml
  - compose/production/app.production.yml
  - compose/production/etl.production.yml
  - compose/production/dagster.production.yml
  - compose/production/prometheus.production.yml
  - compose/production/grafana.production.yml
