[package]
name = "pipeline"
version = "0.1.0"
edition = "2021"

[dependencies]
types = { path = "../types" }
eyre = "0.6"
redis = { version = "0.27", features = ["tokio-comp"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
