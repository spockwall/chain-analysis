[package]
name = "sinks"
version = "0.1.0"
edition = "2021"

[dependencies]
types = { path = "../types" }
async-trait = "0.1"
eyre = "0.6"
neo4rs = "0.8"
redis = { version = "0.27", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
