[package]
name = "consumer"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
types = { path = "../types" }
config = { path = "../config" }
sinks = { path = "../sinks" }
pipeline = { path = "../pipeline" }
observability = { path = "../observability" }
eyre = "0.6"
metrics = "0.24"
neo4rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
