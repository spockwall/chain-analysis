# Observability stack: Prometheus (scrape + storage) + Grafana (dashboards).
# Rust workers expose /metrics on port 9100 inside the chain-analysis-net
# network. Prometheus scrapes them via DNS service discovery.
services:
  # =============================================================================
  # Prometheus — pulls /metrics from each Rust worker on a fixed interval.
  # =============================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: chain-analysis-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--spider", "http://localhost:9090/-/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chain-analysis-net

  # =============================================================================
  # Alertmanager — receives alerts from Prometheus, routes to receivers.
  # Default route is the null receiver; alerts are visible at :9093 only.
  # Swap to the slack receiver by editing observability/alertmanager.yml.
  # =============================================================================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: chain-analysis-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--spider", "http://localhost:9093/-/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chain-analysis-net

  # =============================================================================
  # Grafana — dashboards + alerting UI. Datasource and dashboards provisioned.
  # =============================================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: chain-analysis-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--spider", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chain-analysis-net

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  chain-analysis-net:
    driver: bridge
