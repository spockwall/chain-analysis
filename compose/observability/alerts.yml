groups:
  # ---------------------------------------------------------------------------
  # Scrape liveness. Each Rust worker only runs when there's work; we treat a
  # target that's been unreachable for >10m as notable (but page severity is
  # "info" because short outages are normal during idle periods).
  # ---------------------------------------------------------------------------
  - name: etl-liveness
    rules:
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 10m
        labels:
          severity: info
          component: observability
        annotations:
          summary: "Scrape target {{ $labels.job }} / {{ $labels.instance }} is down"
          description: |
            Prometheus has been unable to scrape {{ $labels.instance }}
            (job {{ $labels.job }}) for >10m. This is expected when a worker
            is idle; investigate only if a schedule was supposed to run.

  # ---------------------------------------------------------------------------
  # Ingest tier: fetch errors & failures.
  # ---------------------------------------------------------------------------
  - name: etl-ingest
    rules:
      - alert: HighIngestFetchFailureRate
        expr: |
          (
            sum by (source) (rate(ingest_blocks_failed_total[5m]))
            /
            clamp_min(
              sum by (source) (rate(ingest_blocks_fetched_total[5m]))
              + sum by (source) (rate(ingest_blocks_failed_total[5m])),
              0.001
            )
          ) > 0.05
        for: 10m
        labels:
          severity: warning
          component: ingest
        annotations:
          summary: "Ingest fetch failure rate >5% for {{ $labels.source }}"
          description: |
            {{ $labels.source }} block fetches are failing at
            {{ $value | humanizePercentage }} over the last 5m. Check upstream
            provider status and API-key rate limits.

      - alert: IngestFetchLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, source) (rate(ingest_fetch_duration_seconds_bucket[10m]))
          ) > 10
        for: 15m
        labels:
          severity: warning
          component: ingest
        annotations:
          summary: "Ingest p95 fetch latency >10s for {{ $labels.source }}"
          description: |
            p95 block-fetch latency is {{ $value | humanizeDuration }} over the
            last 10m. Upstream provider may be degraded.

  # ---------------------------------------------------------------------------
  # Consumer tier: parse failures & DLQ moves.
  # ---------------------------------------------------------------------------
  - name: etl-consumers
    rules:
      - alert: HighParseFailureRate
        expr: sum by (group, stream) (rate(consumer_parse_failures_total[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
          component: consumer
        annotations:
          summary: "Parse failures on {{ $labels.stream }} (group {{ $labels.group }})"
          description: |
            {{ $labels.group }} is failing to parse >0.1 msg/s from
            {{ $labels.stream }} over 5m. Likely a schema drift between
            producer and consumer — inspect one failing payload in the stream.

      - alert: DLQMovesFiring
        expr: sum by (stream) (rate(dlq_moves_total[15m])) > 0
        for: 5m
        labels:
          severity: critical
          component: consumer
        annotations:
          summary: "Batches moved to DLQ on {{ $labels.stream }}"
          description: |
            A consumer exhausted max retries and quarantined a batch to
            {{ $labels.stream }}_dlq. This usually means poisoned data or a
            persistent downstream outage. Inspect the DLQ:
            `redis-cli XRANGE {{ $labels.stream }}_dlq - + COUNT 5`.

      - alert: ConsumerBatchLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, group) (rate(consumer_batch_duration_seconds_bucket[10m]))
          ) > 30
        for: 15m
        labels:
          severity: warning
          component: consumer
        annotations:
          summary: "Consumer p95 batch duration >30s for {{ $labels.group }}"
          description: |
            p95 batch processing time is {{ $value | humanizeDuration }} over
            10m. Check Neo4j/ClickHouse/Postgres load.
