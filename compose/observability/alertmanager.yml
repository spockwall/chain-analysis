# Alertmanager config.
#
# Default receiver is the `null` receiver — alerts fire and show up in the UI
# at http://localhost:9093 but no external notification is sent. To enable
# Slack, set ALERTMANAGER_SLACK_WEBHOOK in your .env and switch the default
# route to `slack` (see the commented block below).
global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "component"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: "null"

  routes:
    # Critical alerts always route through the default receiver. Override here
    # if you want to page (PagerDuty/Opsgenie/etc.).
    - matchers:
        - severity = "critical"
      receiver: "null"
      continue: false

receivers:
  - name: "null"

  # Uncomment + fill ALERTMANAGER_SLACK_WEBHOOK in .env, then change the
  # top-level `receiver` above to "slack" to start notifying Slack.
  # - name: "slack"
  #   slack_configs:
  #     - api_url_file: /etc/alertmanager/slack_webhook
  #       channel: "#chain-analysis-alerts"
  #       send_resolved: true
  #       title: "{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})"
  #       text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}"

inhibit_rules:
  # If an entire target is down, suppress downstream alerts that would
  # otherwise spam while the target is unavailable.
  - source_matchers:
      - alertname = "PrometheusTargetDown"
    target_matchers:
      - severity =~ "warning|critical"
    equal: ["instance"]
