# Application tier: FastAPI backend + Vite frontend.
services:
  # =============================================================================
  # Backend API (FastAPI)
  # =============================================================================
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: chain-analysis-backend
    env_file:
      - ./secrets.dev.env
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=local
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=chain_analysis
      - POSTGRES_USER=postgres
      - REDIS_URL=redis://redis:6379
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY:-}
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - chain-analysis-net

  # =============================================================================
  # Frontend (React + Vite dev server)
  # =============================================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
    container_name: chain-analysis-frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - ../frontend/index.html:/app/index.html
      - ../frontend/vite.config.ts:/app/vite.config.ts
      - ../frontend/tailwind.config.js:/app/tailwind.config.js
      - ../frontend/postcss.config.js:/app/postcss.config.js
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:5173/",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - chain-analysis-net

networks:
  chain-analysis-net:
    driver: bridge
