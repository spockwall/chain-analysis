# Rust ETL: builds the ingest/worker binaries and stages them.
# `ingest-builder` is a one-shot service that copies the ingest binary into a
# shared volume for the Dagster containers to exec. `worker` is a long-running
# Rust process that (A) drains `ingest:targeted_queue` via BRPOP, (B) refreshes
# known/high-risk addresses on an interval, and (C) drains Redis Streams into
# Neo4j + Postgres.
services:
  # =============================================================================
  # Rust ingest binary image (builds once; other services copy the binary in)
  # =============================================================================
  ingest-builder:
    build:
      context: ../etl-rs
      dockerfile: Dockerfile
      target: ingest
    image: chain-analysis/ingest:local
    # One-shot: populate the shared volume, exit.
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      [
        "cp /usr/local/bin/ingest /shared/ingest && echo 'ingest binary
          staged'",
      ]
    volumes:
      - rust_bin:/shared
    networks:
      - chain-analysis-net

  # =============================================================================
  # Rust worker — single long-running container with three tokio tasks:
  #   A) BRPOP `ingest:targeted_queue` for user-triggered targeted fetches
  #   B) periodic refresh of known_labels ∪ high-risk entities
  #   C) XREADGROUP drain of `ingested_*` streams into Neo4j + Postgres
  # Replaces the old `process` container (deleted in Phase I).
  # =============================================================================
  worker:
    build:
      context: ../etl-rs
      dockerfile: Dockerfile
      target: worker
    image: chain-analysis/worker:local
    container_name: chain-analysis-worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - NEO4J_DATABASE=neo4j
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/chain_analysis
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY:-}
      - REFRESH_INTERVAL_SECS=300
      - REFRESH_COOLDOWN_SECS=1800
      - TARGETED_BRPOP_TIMEOUT_SECS=5
      - NEIGHBORHOOD_TX_LIMIT_PER_ADDR=500
      - MAX_PEERS_PER_HOP=20
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - chain-analysis-net

volumes:
  rust_bin:

networks:
  chain-analysis-net:
    driver: bridge
