# Rust ETL: the long-running `worker` process.
# Task A: drains `ingest:targeted_queue` via BRPOP.
# Task B: refreshes known/high-risk addresses on an interval.
# Task C: drains Redis Streams into Neo4j + Postgres.
services:
  # =============================================================================
  # Rust worker — single long-running container with three tokio tasks:
  #   A) BRPOP `ingest:targeted_queue` for user-triggered targeted fetches
  #   B) periodic refresh of known_labels ∪ high-risk entities
  #   C) XREADGROUP drain of `ingested_*` streams into Neo4j + Postgres
  # Replaces the old `process` container (deleted in Phase I).
  # =============================================================================
  worker:
    build:
      context: ../etl-rs
      dockerfile: Dockerfile
      target: worker
    image: chain-analysis/worker:local
    container_name: chain-analysis-worker
    restart: unless-stopped
    env_file:
      - ./secrets.dev.env
    environment:
      - REDIS_URL=redis://redis:6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_DATABASE=neo4j
      - LOG_DIR=/var/log/chain-analysis
      - REFRESH_INTERVAL_SECS=300
      - REFRESH_COOLDOWN_SECS=1800
      - TARGETED_BRPOP_TIMEOUT_SECS=5
      - NEIGHBORHOOD_TX_LIMIT_PER_ADDR=500
      - MAX_PEERS_PER_HOP=20
    volumes:
      # Mount worker logs to host so operators can `tail -f etl-rs/logs/worker.log`
      # without needing to `docker exec` into the container. Path inside the
      # container matches LOG_DIR above.
      - ../etl-rs/logs:/var/log/chain-analysis
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - chain-analysis-net

networks:
  chain-analysis-net:
    driver: bridge
