# Rust ETL: builds the ingest/process binaries and stages them.
# `ingest-builder` is a one-shot service that copies the ingest binary into a
# shared volume for the Dagster containers to exec. `process` is a long-running
# consumer that drains Redis Streams into Neo4j + Postgres.
services:
  # =============================================================================
  # Rust ingest binary image (builds once; other services copy the binary in)
  # =============================================================================
  ingest-builder:
    build:
      context: ../etl-rs
      dockerfile: Dockerfile
      target: ingest
    image: chain-analysis/ingest:local
    # One-shot: populate the shared volume, exit.
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      [
        "cp /usr/local/bin/ingest /shared/ingest && echo 'ingest binary
          staged'",
      ]
    volumes:
      - rust_bin:/shared
    networks:
      - chain-analysis-net

  # =============================================================================
  # Rust process consumer — drains Redis Streams into Neo4j + Postgres.
  # Without this, ingested transactions pile up in `ingested_txs` but never
  # reach the graph, so the frontend stays empty.
  # =============================================================================
  process:
    build:
      context: ../etl-rs
      dockerfile: Dockerfile
      target: process
    image: chain-analysis/process:local
    container_name: chain-analysis-process
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - NEO4J_DATABASE=neo4j
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/chain_analysis
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - chain-analysis-net

volumes:
  rust_bin:

networks:
  chain-analysis-net:
    driver: bridge
