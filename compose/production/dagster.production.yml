# Dagster orchestration for production.
services:
  dagster-webserver:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: chain-analysis-dagster-webserver
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-m", "etl.definitions"]
    entrypoint: []
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DAGSTER_HOME=/opt/dagster/home
      - RUST_INGEST_BINARY=/opt/rust-bin/ingest
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - INGEST_TARGETED_QUEUE=${INGEST_TARGETED_QUEUE:-ingest:targeted_queue}
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY}
      - ALCHEMY_API_KEY=${ALCHEMY_API_KEY:-}
      - INGEST_SOURCE=${INGEST_SOURCE:-}
    volumes:
      - dagster_home:/opt/dagster/home
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - chain-analysis-net

  dagster-daemon:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: chain-analysis-dagster-daemon
    command: ["dagster-daemon", "run", "-m", "etl.definitions"]
    entrypoint: []
    restart: unless-stopped
    environment:
      - DAGSTER_HOME=/opt/dagster/home
      - RUST_INGEST_BINARY=/opt/rust-bin/ingest
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - INGEST_TARGETED_QUEUE=${INGEST_TARGETED_QUEUE:-ingest:targeted_queue}
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY}
      - ALCHEMY_API_KEY=${ALCHEMY_API_KEY:-}
      - INGEST_SOURCE=${INGEST_SOURCE:-}
    volumes:
      - dagster_home:/opt/dagster/home
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - chain-analysis-net

volumes:
  dagster_home:

networks:
  chain-analysis-net:
    driver: bridge
