name: CI/CD Production

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-frontend:
    name: Frontend npm build check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  ci-frontend-docker:
    name: Frontend Docker build check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend production image
        run: docker build -f frontend/Dockerfile --target production -t chain-analysis-frontend:ci frontend

  ci-backend:
    name: Backend Docker build check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend production image
        run: docker build -f backend/Dockerfile -t chain-analysis-backend:ci .

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs:
      - ci-frontend
      - ci-frontend-docker
      - ci-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: production

    steps:
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" << EOF
            set -euo pipefail

            cd "${DEPLOY_PATH}"

            echo "=== sync repo ==="
            git fetch origin
            git checkout main
            git reset --hard origin/main

            echo "=== validate compose ==="
            docker compose -f docker-compose.production.yml config > /dev/null

            echo "=== pull image-based services ==="
            docker compose -f docker-compose.production.yml pull neo4j postgres redis minio minio-init || true

            echo "=== rebuild and restart ==="
            docker compose -f docker-compose.production.yml up -d --build --remove-orphans

            echo "=== service status ==="
            docker compose -f docker-compose.production.yml ps

            echo "=== backend logs ==="
            docker compose -f docker-compose.production.yml logs --tail=80 backend || true

            echo "=== frontend logs ==="
            docker compose -f docker-compose.production.yml logs --tail=80 frontend || true
          EOF
