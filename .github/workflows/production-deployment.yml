name: Production Deployment

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  predeploy-verify:
    name: Predeploy verification
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test -- --run --passWithNoTests
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade uv
          uv venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Critical backend lint
        working-directory: backend
        run: .venv/bin/ruff check . --select E9,F63,F7,F82

      - name: Backend type check advisory
        working-directory: backend
        run: |
          set +e
          MYPYPATH=src .venv/bin/mypy --explicit-package-bases src
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::mypy reported advisory issues; predeploy verification continues because strict typing is not yet enforced."
          fi
          exit 0

      - name: Start backend test infrastructure
        run: docker compose up -d --wait --wait-timeout 180 neo4j postgres redis minio

      - name: Apply test database migrations
        working-directory: backend
        run: .venv/bin/alembic upgrade head

      - name: Test backend
        working-directory: backend
        run: .venv/bin/pytest -m "not integration"

      - name: Stop backend test infrastructure
        if: always()
        run: docker compose down -v

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: etl-rs -> target

      - name: Validate Rust ETL
        working-directory: etl-rs
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings -A clippy::too_many_arguments
          cargo test --workspace
          cargo build --workspace --release

      - name: Validate compose files
        run: |
          set -euo pipefail
          env_file="$(mktemp)"
          trap 'rm -f "$env_file"' EXIT
          cat > "$env_file" <<'EOF'
          ENVIRONMENT=production
          NEO4J_USER=ci-neo4j
          NEO4J_PASSWORD=ci-neo4j-password
          POSTGRES_USER=ci-postgres
          POSTGRES_PASSWORD=ci-postgres-password
          POSTGRES_DB=chain_analysis
          REDIS_PASSWORD=ci-redis-password
          MINIO_ROOT_USER=ci-minio
          MINIO_ROOT_PASSWORD=ci-minio-password
          MINIO_BUCKET=chain-analysis
          JWT_SECRET_KEY=ci-jwt-secret
          ALLIUM_API_KEY=ci-allium-key
          ETHERSCAN_API_KEY=ci-etherscan-key
          EOF
          docker compose -f docker-compose.yml config --quiet
          docker compose --env-file "$env_file" -f docker-compose.production.yml config --quiet

      - name: Build deployment images
        run: |
          docker build -f frontend/Dockerfile --target production -t chain-analysis-frontend:release-check frontend
          docker build -f backend/Dockerfile -t chain-analysis-backend:release-check .
          docker build -f etl-rs/Dockerfile --target ingest -t chain-analysis-ingest:release-check etl-rs
          docker build -f etl-rs/Dockerfile --target process -t chain-analysis-process:release-check etl-rs

  reject-non-release-dispatch:
    name: Reject non-release manual dispatch
    if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest

    steps:
      - name: Stop non-release deployment
        run: |
          echo "Production deployment can only run from release/* branches."
          exit 1

  deploy:
    name: Deploy production
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    needs:
      - predeploy-verify
    environment: production

    steps:
      - name: Confirm release ref
        run: |
          set -euo pipefail
          release_branch="${GITHUB_REF#refs/heads/}"
          case "$release_branch" in
            release/*) ;;
            *)
              echo "Deployment can only run from release/* branches."
              exit 1
              ;;
          esac
          echo "RELEASE_BRANCH=$release_branch" >> "$GITHUB_ENV"

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/production_deploy_key"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "SSH_KEY_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Deploy release on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH SSH_KEY_FILE RELEASE_BRANCH; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required deployment setting: $name"
              exit 1
            fi
          done

          ssh -i "$SSH_KEY_FILE" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' -- "$DEPLOY_PATH" "$RELEASE_BRANCH" <<'REMOTE'
          set -euo pipefail

          deploy_path="$1"
          release_branch="$2"

          case "$release_branch" in
            release/*) ;;
            *)
              echo "Deployment can only run from release/* branches."
              exit 1
              ;;
          esac

          cd "$deploy_path"
          git fetch origin "$release_branch"
          git checkout "$release_branch"
          git reset --hard "origin/$release_branch"
          bash scripts/deploy_production_release.sh "$release_branch"
          REMOTE

      - name: Remove SSH key
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${SSH_KEY_FILE:-}" ]; then
            rm -f "$SSH_KEY_FILE"
          fi
