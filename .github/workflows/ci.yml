name: CI

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test -- --run --passWithNoTests

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Build production image
        run: docker build -f frontend/Dockerfile --target production -t chain-analysis-frontend:ci frontend

  backend:
    name: Backend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        working-directory: backend
        run: |
          uv venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Critical lint
        working-directory: backend
        run: .venv/bin/ruff check . --select E9,F63,F7,F82

      - name: Type check advisory
        continue-on-error: true
        working-directory: backend
        run: .venv/bin/mypy src

      - name: Start backend test infrastructure
        run: docker compose up -d --wait --wait-timeout 180 neo4j postgres redis minio

      - name: Test
        working-directory: backend
        run: .venv/bin/pytest -m "not integration"

      - name: Stop backend test infrastructure
        if: always()
        run: docker compose down

      - name: Build production image
        run: docker build -f backend/Dockerfile -t chain-analysis-backend:ci .

  rust-etl:
    name: Rust ETL validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: etl-rs -> target

      - name: Format check
        working-directory: etl-rs
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: etl-rs
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::too_many_arguments -A dead_code

      - name: Test
        working-directory: etl-rs
        run: cargo test --workspace

      - name: Release build
        working-directory: etl-rs
        run: cargo build --workspace --release

      - name: Build ingest image
        run: docker build -f etl-rs/Dockerfile --target ingest -t chain-analysis-ingest:ci etl-rs

      - name: Build process image
        run: docker build -f etl-rs/Dockerfile --target process -t chain-analysis-process:ci etl-rs

  compose:
    name: Compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate local compose file
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate production compose file
        run: |
          set -euo pipefail
          env_file="$(mktemp)"
          trap 'rm -f "$env_file"' EXIT
          cat > "$env_file" <<'EOF'
          ENVIRONMENT=production
          NEO4J_USER=ci-neo4j
          NEO4J_PASSWORD=ci-neo4j-password
          POSTGRES_USER=ci-postgres
          POSTGRES_PASSWORD=ci-postgres-password
          POSTGRES_DB=chain_analysis
          REDIS_PASSWORD=ci-redis-password
          MINIO_ROOT_USER=ci-minio
          MINIO_ROOT_PASSWORD=ci-minio-password
          MINIO_BUCKET=chain-analysis
          JWT_SECRET_KEY=ci-jwt-secret
          ALLIUM_API_KEY=ci-allium-key
          ETHERSCAN_API_KEY=ci-etherscan-key
          EOF
          docker compose --env-file "$env_file" -f docker-compose.production.yml config --quiet
