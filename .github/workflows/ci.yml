name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - "release-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test -- --run --passWithNoTests

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Build production image
        run: docker build -f frontend/Dockerfile --target production -t chain-analysis-frontend:ci frontend

  backend:
    name: Backend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        working-directory: backend
        run: |
          uv venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Critical lint
        working-directory: backend
        run: .venv/bin/ruff check . --select E9,F63,F7,F82

      - name: Type check advisory
        working-directory: backend
        run: |
          set +e
          MYPYPATH=src .venv/bin/mypy --explicit-package-bases src
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::mypy reported advisory issues; backend CI continues because strict typing is not yet enforced."
          fi
          exit 0

      - name: Start backend test infrastructure
        run: docker compose up -d --wait --wait-timeout 180 neo4j postgres redis

      - name: Apply test database migrations
        working-directory: backend
        run: .venv/bin/alembic upgrade head

      - name: Test
        working-directory: backend
        run: .venv/bin/pytest -m "not integration"

      - name: Stop backend test infrastructure
        if: always()
        run: docker compose down -v

      - name: Build production image
        run: docker build -f backend/Dockerfile -t chain-analysis-backend:ci .

  rust-etl:
    name: Rust ETL validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: etl-rs -> target

      - name: Unit tests
        working-directory: etl-rs
        run: cargo test --workspace --lib

      - name: Integration tests (testcontainers e2e + chaos)
        working-directory: etl-rs
        # `--test-threads=1` because each test starts its own Redis/PG/Neo4j
        # stack and they shouldn't fight for ports / Docker resources.
        env:
          RUST_LOG: info
        run: cargo test --workspace --tests -- --ignored --test-threads=1

      - name: Release build
        working-directory: etl-rs
        run: cargo build --workspace --release

      - name: Build ingest image
        run: docker build -f etl-rs/Dockerfile --target ingest -t chain-analysis-ingest:ci etl-rs

      - name: Build worker image
        run: docker build -f etl-rs/Dockerfile --target worker -t chain-analysis-worker:ci etl-rs

  rust-etl-bench:
    name: Rust ETL bench (label-gated)
    runs-on: ubuntu-latest
    # Opt-in: only runs when the `run-bench` label is on the PR. CI numbers
    # are noisy on shared runners; gating prevents per-PR overhead.
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-bench')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: etl-rs -> target

      - name: Run ingest_throughput bench
        working-directory: etl-rs
        run: cargo bench -p etl --bench ingest_throughput

  compose:
    name: Compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate local compose file
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate production compose file
        run: |
          set -euo pipefail
          env_file="$(mktemp)"
          trap 'rm -f "$env_file"' EXIT
          cat > "$env_file" <<'EOF'
          ENVIRONMENT=production
          NEO4J_USER=ci-neo4j
          NEO4J_PASSWORD=ci-neo4j-password
          POSTGRES_USER=ci-postgres
          POSTGRES_PASSWORD=ci-postgres-password
          POSTGRES_DB=chain_analysis
          REDIS_PASSWORD=ci-redis-password
          CLICKHOUSE_DB=chain_analysis
          CLICKHOUSE_USER=default
          CLICKHOUSE_PASSWORD=ci-clickhouse-password
          JWT_SECRET_KEY=ci-jwt-secret
          ETHERSCAN_API_KEY=ci-etherscan-key
          EOF
          docker compose --env-file "$env_file" -f docker-compose.production.yml config --quiet
