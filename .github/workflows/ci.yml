name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - "release-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test -- --run --passWithNoTests

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Build production image
        run: docker build -f frontend/Dockerfile --target production -t chain-analysis-frontend:ci frontend

  backend:
    name: Backend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare local compose secrets
        run: |
          set -euo pipefail
          mkdir -p compose

          # Root .env is consumed by host-side commands in this workflow
          # (Alembic, pytest, and docker compose interpolation). Keep hostnames
          # reachable from the GitHub runner.
          cat > .env <<'EOF'
          ENVIRONMENT=local
          NEO4J_URI=bolt://localhost:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=changeme
          NEO4J_AUTH=neo4j/changeme
          NEO4J_PLUGINS=[]
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          POSTGRES_DB=chain_analysis
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=changeme
          REDIS_PASSWORD=changeme
          REDIS_URL=redis://localhost:6379
          DATABASE_URL=postgresql://postgres:changeme@localhost:5432/chain_analysis
          CLICKHOUSE_DB=chain_analysis
          CLICKHOUSE_USER=default
          CLICKHOUSE_PASSWORD=changeme
          JWT_SECRET_KEY=changeme
          ETHERSCAN_API_KEY=
          ALCHEMY_API_KEY=
          INGEST_SOURCE=
          EOF

          # compose/*.yml files load this path from within the compose/
          # directory. These values are injected into containers, where service
          # names such as postgres/redis/neo4j are valid.
          cat > compose/secrets.dev.env <<'EOF'
          ENVIRONMENT=local
          NEO4J_URI=bolt://neo4j:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=changeme
          NEO4J_AUTH=neo4j/changeme
          NEO4J_PLUGINS=[]
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          POSTGRES_DB=chain_analysis
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=changeme
          REDIS_PASSWORD=changeme
          REDIS_URL=redis://redis:6379
          DATABASE_URL=postgresql://postgres:changeme@postgres:5432/chain_analysis
          CLICKHOUSE_DB=chain_analysis
          CLICKHOUSE_USER=default
          CLICKHOUSE_PASSWORD=changeme
          JWT_SECRET_KEY=changeme
          ETHERSCAN_API_KEY=
          ALCHEMY_API_KEY=
          INGEST_SOURCE=
          EOF

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        working-directory: backend
        run: |
          uv venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Critical lint
        working-directory: backend
        run: .venv/bin/ruff check . --select E9,F63,F7,F82

      - name: Type check advisory
        working-directory: backend
        run: |
          set +e
          MYPYPATH=src .venv/bin/mypy --explicit-package-bases src
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::mypy reported advisory issues; backend CI continues because strict typing is not yet enforced."
          fi
          exit 0

      - name: Start backend test infrastructure
        run: |
          set -euo pipefail

          docker compose up -d neo4j postgres redis

          deadline=$((SECONDS + 240))
          while true; do
            neo_state="$(docker inspect -f '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' chain-analysis-neo4j 2>/dev/null || true)"
            pg_state="$(docker inspect -f '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' chain-analysis-postgres 2>/dev/null || true)"
            redis_state="$(docker inspect -f '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' chain-analysis-redis 2>/dev/null || true)"

            echo "neo4j=${neo_state:-missing} postgres=${pg_state:-missing} redis=${redis_state:-missing}"

            if echo "$neo_state" | grep -q '^exited'; then
              echo "::error::Neo4j exited during startup."
              docker compose ps
              docker compose logs --no-color --tail=200 neo4j postgres redis
              exit 1
            fi

            if echo "$neo_state" | grep -q 'healthy' \
              && echo "$pg_state" | grep -q 'healthy' \
              && echo "$redis_state" | grep -q 'healthy'; then
              break
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for backend infrastructure to become healthy."
              docker compose ps
              docker compose logs --no-color --tail=200 neo4j postgres redis
              exit 1
            fi

            sleep 5
          done

      - name: Apply test database migrations
        working-directory: backend
        run: .venv/bin/alembic upgrade head

      - name: Test
        working-directory: backend
        run: .venv/bin/pytest -m "not integration"

      - name: Stop backend test infrastructure
        if: always()
        run: docker compose down -v

      - name: Remove local compose secrets
        if: always()
        run: rm -f .env compose/secrets.dev.env

      - name: Build production image
        run: docker build -f backend/Dockerfile -t chain-analysis-backend:ci .

  rust-etl:
    name: Rust ETL validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: etl-rs -> target

      - name: Unit tests
        working-directory: etl-rs
        run: cargo test --workspace --lib

      - name: Integration tests (testcontainers e2e + chaos)
        working-directory: etl-rs
        # `--test-threads=1` because each test starts its own Redis/PG/Neo4j
        # stack and they shouldn't fight for ports / Docker resources.
        env:
          RUST_LOG: info
        run: cargo test --workspace --tests -- --ignored --test-threads=1

      - name: Release build
        working-directory: etl-rs
        run: cargo build --workspace --release

      - name: Build ingest image
        run: docker build -f etl-rs/Dockerfile --target ingest -t chain-analysis-ingest:ci etl-rs

      - name: Build worker image
        run: docker build -f etl-rs/Dockerfile --target worker -t chain-analysis-worker:ci etl-rs

  rust-etl-bench:
    name: Rust ETL bench (label-gated)
    runs-on: ubuntu-latest
    # Opt-in: only runs when the `run-bench` label is on the PR. CI numbers
    # are noisy on shared runners; gating prevents per-PR overhead.
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-bench')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: etl-rs -> target

      - name: Run ingest_throughput bench
        working-directory: etl-rs
        run: cargo bench -p etl --bench ingest_throughput

  compose:
    name: Compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare local compose secrets
        run: |
          set -euo pipefail
          mkdir -p compose

          # Root .env is used by docker compose interpolation. Values are also
          # safe for any host-side validation command that reads the app config.
          cat > .env <<'EOF'
          ENVIRONMENT=local
          NEO4J_URI=bolt://localhost:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=changeme
          NEO4J_AUTH=neo4j/changeme
          NEO4J_PLUGINS=[]
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          POSTGRES_DB=chain_analysis
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=changeme
          REDIS_PASSWORD=changeme
          REDIS_URL=redis://localhost:6379
          DATABASE_URL=postgresql://postgres:changeme@localhost:5432/chain_analysis
          CLICKHOUSE_DB=chain_analysis
          CLICKHOUSE_USER=default
          CLICKHOUSE_PASSWORD=changeme
          JWT_SECRET_KEY=changeme
          ETHERSCAN_API_KEY=
          ALCHEMY_API_KEY=
          INGEST_SOURCE=
          EOF

          cat > compose/secrets.dev.env <<'EOF'
          ENVIRONMENT=local
          NEO4J_URI=bolt://neo4j:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=changeme
          NEO4J_AUTH=neo4j/changeme
          NEO4J_PLUGINS=[]
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          POSTGRES_DB=chain_analysis
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=changeme
          REDIS_PASSWORD=changeme
          REDIS_URL=redis://redis:6379
          DATABASE_URL=postgresql://postgres:changeme@postgres:5432/chain_analysis
          CLICKHOUSE_DB=chain_analysis
          CLICKHOUSE_USER=default
          CLICKHOUSE_PASSWORD=changeme
          JWT_SECRET_KEY=changeme
          ETHERSCAN_API_KEY=
          ALCHEMY_API_KEY=
          INGEST_SOURCE=
          EOF

      - name: Validate local compose file
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate production compose file
        run: |
          set -euo pipefail
          env_file="$(mktemp)"
          trap 'rm -f "$env_file"' EXIT
          cat > "$env_file" <<'EOF'
          ENVIRONMENT=production
          NEO4J_USER=ci-neo4j
          NEO4J_PASSWORD=ci-neo4j-password
          POSTGRES_USER=ci-postgres
          POSTGRES_PASSWORD=ci-postgres-password
          POSTGRES_DB=chain_analysis
          REDIS_PASSWORD=ci-redis-password
          CLICKHOUSE_DB=chain_analysis
          CLICKHOUSE_USER=default
          CLICKHOUSE_PASSWORD=ci-clickhouse-password
          JWT_SECRET_KEY=ci-jwt-secret
          ETHERSCAN_API_KEY=ci-etherscan-key
          EOF
          docker compose --env-file "$env_file" -f docker-compose.production.yml config --quiet

      - name: Remove local compose secrets
        if: always()
        run: rm -f .env compose/secrets.dev.env
