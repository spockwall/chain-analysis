[project]
name = "chain-analysis"
version = "0.1.0"
description = "Blockchain transaction analysis platform for detecting and investigating money laundering patterns"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "mcp>=1.26.0,<2.0.0",

    # Database
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "neo4j>=5.26.0",

    # Message Queue
    "redis>=5.2.0",
    "slowapi>=0.1.4",
    "limits>=2.9.0",

    # ETL Orchestration
    "dagster>=1.9.0",
    "dagster-webserver>=1.9.0",

    # HTTP Client
    "httpx>=0.28.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "email-validator>=2.1.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "orjson>=3.10.0",
]

[project.scripts]
chain-analysis-mcp = "agent_mcp.server:main"
chain-analysis-mcp-http = "agent_mcp.server:main_http"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests (require running services)",
]
